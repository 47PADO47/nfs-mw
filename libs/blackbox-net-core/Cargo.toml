[package]
name = "blackbox-net-core"
description = "Generic netcode building blocks: bit packing and quantisers, datagram links, a reliability layer, delta replication over a registered schema, clock sync, a session state machine, LAN discovery, rate limits and hand-off queues; with the netcode feature, a Noise handshake and sealed packets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The bounded hand-off queues between the net thread and the game thread (also wanted by the telemetry server).
handoff = ["dep:crossbeam-queue", "dep:triple_buffer"]
# The secure channel: Noise handshake, cookies, sealed packets, connect tokens, the room password. Pulls the crypto.
netcode = [
    "handoff",
    "dep:blake2",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:sha2",
    "dep:snow",
    "dep:spake2",
    "dep:subtle",
    "dep:zeroize",
]

[dependencies]
blake2 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
crossbeam-queue = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
snow = { workspace = true, optional = true }
spake2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
triple_buffer = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[lints]
workspace = true
