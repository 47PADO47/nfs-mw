[package]
name = "blackbox-render"
description = "Backend-neutral renderer for EA Black Box game reimplementations (wgpu: Vulkan, D3D12, OpenGL)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
streamline = ["dep:ash", "dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
ash = { version = "0.38", optional = true }
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Direct3D12", "Win32_System_Performance", "Win32_System_Threading"] }

[dependencies]
blackbox-trace.workspace = true
blackbox-gfx.workspace = true
blackbox-gpu-passes.workspace = true
blackbox-smaa.workspace = true
bytemuck.workspace = true
foldhash.workspace = true
fsr3-wgpu.workspace = true
glam.workspace = true
log.workspace = true
half = "2.7.1"
pollster.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
env_logger.workspace = true
# Synthetic scenes, image metrics and digests for the native regression guard.
blackbox-gfx-testkit.workspace = true
# The serial lock the GPU tests share with the passes crate.
blackbox-gpu-passes = { workspace = true, features = ["test-support"] }
# Validates the WGSL sources without a GPU.
naga.workspace = true

[lints]
workspace = true
