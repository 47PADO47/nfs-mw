[package]
name = "blackbox-movie"
description = "Demuxer, VP6 decoder glue and playback timing for the EA movie container (MVhd/MV0K/MV0F/SCxx) of EA Black Box games."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["vp6"]
# VP6 frame decoding through the MIT-licensed NihAV subset. Without it only the demuxer and the
# timeline are built.
vp6 = ["dep:nihav_core", "dep:nihav_duck"]

[dependencies]
nihav_core = { workspace = true, optional = true }
nihav_duck = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true
