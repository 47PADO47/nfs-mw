[package]
name = "blackbox-bevy-render"
description = "Optional Bevy 0.20 renderer backend for EA Black Box game reimplementations, behind blackbox-gfx."
version.workspace = true
edition.workspace = true
# Bevy's WESL shader stack (wesl, wgsl-parse) needs 1.97.1; the rest of the workspace stays on 1.95, because
# nothing else depends on this crate (`cargo +1.95.0 check -p nfsmw` still passes without the renderer-bevy feature).
rust-version = "1.97.1"
license.workspace = true
publish.workspace = true

[dependencies]
blackbox-gfx.workspace = true
# The world effect layer and the UI layer: the same passes the native renderer draws them with.
blackbox-gpu-passes.workspace = true
# The Bevy render crates are pinned in the workspace (docs/decisions/0004-swappable-renderers.md).
bevy_anti_alias.workspace = true
bevy_app.workspace = true
bevy_asset.workspace = true
bevy_camera.workspace = true
bevy_color.workspace = true
bevy_core_pipeline.workspace = true
bevy_diagnostic.workspace = true
bevy_ecs.workspace = true
bevy_image.workspace = true
bevy_light.workspace = true
bevy_material.workspace = true
bevy_math.workspace = true
bevy_mesh.workspace = true
bevy_pbr.workspace = true
# Bloom: see the comment in the workspace Cargo.toml.
bevy_post_process.workspace = true
bevy_reflect.workspace = true
bevy_render.workspace = true
bevy_shader.workspace = true
bevy_time.workspace = true
bevy_transform.workspace = true
bevy_window.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing = { version = "0.1", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }
tracing-tracy = { version = "0.12", optional = true }
wgpu.workspace = true
# Solari ray tracing, behind `ray-tracing`.
bevy_solari = { workspace = true, optional = true }
# FSR 3.1 temporal upscaler, behind `fsr3`.
fsr3-wgpu = { workspace = true, optional = true }

[features]
# DLSS Super Resolution through Bevy's `dlss` feature, which wraps `dlss_wgpu`. Needs the NVIDIA DLSS SDK at build
# time (DLSS_SDK, VULKAN_SDK, clang). Vulkan and NVIDIA RTX only. The `bevy_solari?/dlss` part turns on DLSS Ray
# Reconstruction as the Solari denoiser when `ray-tracing` is also built. docs/upscaling.md, docs/setup.md.
dlss = ["bevy_anti_alias/dlss", "bevy_solari?/dlss"]
# No SDK: compiles the DLSS code path against a stand-in (CI and tests). Maps Bevy's `force_disable_dlss`, which
# only has an effect together with `dlss`, so this feature alone compiles without the SDK.
dlss-mock = ["bevy_anti_alias/force_disable_dlss"]
# Solari ray tracing (startup-gated, needs the wgpu ray-query features). bevy_solari turns on bevy_pbr's `dfg_lut`,
# which turns on bevy_image's `zstd` without a backend; `zstd_rust` (pure Rust, no C compiler) supplies one.
ray-tracing = ["dep:bevy_solari", "bevy_image/zstd_rust"]
# FSR 3.1 temporal upscaler (libs/fsr3-wgpu), Vulkan and DX12.
fsr3 = ["dep:fsr3-wgpu"]
# Tracy profiling: emit Bevy's per-system `tracing` spans and install a Tracy subscriber. Build via
# nfsmw's `trace` feature and run with the Tracy client attached. See docs/bevy-backend.md.
trace = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-tracy",
    # System names in the trace (without it every system shows as "<Enable the debug feature ...>").
    "bevy_ecs/debug",
    "bevy_app/trace",
    "bevy_ecs/trace",
    "bevy_render/trace",
    "bevy_core_pipeline/trace",
    "bevy_pbr/trace",
    "bevy_asset/trace",
]

[dev-dependencies]
# System names in Bevy's error messages.
bevy_ecs = { workspace = true, features = ["debug"] }
# The native renderer, the other side of the cross-backend comparisons, and the scenes both draw.
blackbox-gfx-testkit.workspace = true
blackbox-render.workspace = true
# The serial lock GPU tests share: parallel Vulkan device creation crashes some Mesa drivers.
blackbox-gpu-passes = { workspace = true, features = ["test-support"] }
# Writes pictures for looking at when BLACKBOX_DUMP_DIR is set.
png.workspace = true
# Shows what Bevy logs (shader and pipeline errors) in the GPU tests.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[lints]
workspace = true
