[package]
name = "blackbox-modding"
description = "Native mod plugins for Black Box games: the versioned C ABI, the mod SDK and the host loader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["abi"]
abi = []
sdk = ["abi"]
# The loader and dispatcher (ADR 0005 section 3). Only the host pulls in the file, manifest and loading crates; a mod
# that links `sdk` gets none of them.
host = ["abi", "dep:blackbox-vehicle", "dep:libloading", "dep:semver", "dep:serde", "dep:sha2", "dep:thiserror", "dep:toml", "dep:log"]

[dependencies]
blackbox-vehicle = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
log = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[lints]
workspace = true
