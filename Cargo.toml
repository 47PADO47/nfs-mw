nfsmw-server = { path = "crates/nfsmw-server" }
nfsmw-sim = { path = "crates/nfsmw-sim" }

# Third-party (see docs/rust-stack.md for why each was picked)
# Bevy: the ECS shell (docs/decisions/0001-bevy.md), plus the render crates only blackbox-bevy-render uses
# (docs/decisions/0004-swappable-renderers.md). Pinned to the exact 0.20 release.
bevy_a11y = "=0.20.0"
bevy_anti_alias = "=0.20.0"
bevy_app = "=0.20.0"
bevy_asset = "=0.20.0"
bevy_camera = "=0.20.0"
bevy_color = "=0.20.0"
bevy_core_pipeline = "=0.20.0"
bevy_diagnostic = "=0.20.0"
bevy_ecs = "=0.20.0"
bevy_image = "=0.20.0"
bevy_light = "=0.20.0"
bevy_log = "=0.20.0"
bevy_material = "=0.20.0"
bevy_math = "=0.20.0"
bevy_mesh = "=0.20.0"
bevy_pbr = "=0.20.0"
# Bloom (depth of field and other screen-space effects are not used): moved out of bevy_core_pipeline in 0.20.
bevy_post_process = "=0.20.0"
bevy_reflect = "=0.20.0"
bevy_render = "=0.20.0"
bevy_shader = "=0.20.0"
bevy_tasks = "=0.20.0"
# Solari ray tracing (ADR 0004, `ray-tracing` feature of blackbox-bevy-render). Exists on crates.io for 0.20.0.
bevy_solari = "=0.20.0"
bevy_transform = "=0.20.0"
bevy_gilrs = "=0.20.0"
bevy_input = { version = "=0.20.0", features = ["serialize"] }
bevy_time = "=0.20.0"
bevy_window = { version = "=0.20.0", features = ["custom_cursor"] }
bevy_winit = { version = "=0.20.0", features = ["custom_cursor"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
discord-presence = "=3.2.0"
egui = "0.36"
# Translations (docs/decisions/0012-localization.md): Fluent catalogues, BCP 47 tags and the system locale.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
env_logger = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
foldhash = "0.2.0"
glam = { version = "0.34", features = ["bytemuck"] }
kira = { version = "0.12", default-features = false, features = ["cpal"] }
libloading = "0.8"
log = "0.4"
mimalloc = { version = "0.1", default-features = false }
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
png = "0.18"
pollster = "0.4"
raw-window-handle = "0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# Multiplayer transport security and hand-off (blackbox-net-core features `netcode` and `handoff`; docs/rust-stack.md).
# Versions match what snow itself pulls, so each crypto crate is compiled once.
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
crossbeam-queue = "0.3"
getrandom = "0.3"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-sha2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
socket2 = { version = "0.6", features = ["all"] }
spake2 = "0.4"
subtle = { version = "2.6", default-features = false }
triple_buffer = "9"
zeroize = "1"
texture2ddecoder = "0.1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "id3v2", "id3v1", "ape"] }
thiserror = "2"
toml = "0.9"
unicode-normalization = "0.1"
unicode-security = "0.1"
wgpu = "30"
winreg = "0.56"
# VP6 video: the VP5/VP6 subset of NihAV that Ruffle split out and kindly had relicensed to MIT by its
# author (COPYING in the repo). Pinned to a commit; not on crates.io. deny.toml lists the repo.
nihav_core = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }
nihav_duck = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Our own crates: the per-frame render bridge and scene systems are CPU work on every frame, so unoptimised code
# shows up as frame time in dev builds. Level 1 keeps compiles quick. To step through code in a debugger, set
# CARGO_PROFILE_DEV_OPT_LEVEL=0: optimised code skips breakpoints.
opt-level = 1

[profile.dev.package."*"]
# Dependencies only (workspace members are not matched by "*"). No debug info: it is rarely stepped into and it
# dominates link time.
opt-level = 2
debug = false

# Our own crates that decode, parse, simulate or record a frame. "*" above does not cover workspace members, so without
# these they build at opt-level 1, and a dev build streams, plays movies and renders several times slower than release.
[profile.dev.package.ea-compress]
opt-level = 3
[profile.dev.package.ea-audio]
opt-level = 3
[profile.dev.package.blackbox-chunk]
opt-level = 3
[profile.dev.package.blackbox-tpk]
opt-level = 3
[profile.dev.package.blackbox-solid]
opt-level = 3
[profile.dev.package.blackbox-attrib]
opt-level = 3
[profile.dev.package.blackbox-collision]
opt-level = 3
[profile.dev.package.blackbox-vehicle]
opt-level = 3
[profile.dev.package.blackbox-movie]
opt-level = 3
[profile.dev.package.blackbox-feng]
opt-level = 3
[profile.dev.package.blackbox-render]
opt-level = 3

[profile.release]
# Thin LTO and one codegen unit: inlining across the workspace crates (renderer, readers, physics) matters for the
# per-frame cost. Unwinding stays on: the world loading thread reports a panic instead of taking the game down.
lto = "thin"
codegen-units = 1

[profile.profiling]
# Release codegen plus line tables, so Tracy, VTune, Superluminal and perf can name functions and source lines.
# Same optimisation as release: only debug info is added, so timings stay representative.
inherits = "release"
debug = "line-tables-only"

[profile.dist]
# Shipped builds: fat LTO and one codegen unit for the last few percent of runtime. Much slower to build than release,
# so use it for releases only, not for iteration.
inherits = "release"
lto = "fat"
codegen-units = 1
