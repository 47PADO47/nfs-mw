[workspace]
resolver = "3"
# libs/   engine-generic libraries (EA Black Box formats, codecs, install discovery, rendering).
#         No NFS:MW-specific code: they are meant to move to a shared utilities monorepo.
# crates/ the NFS:MW game itself.
# mods/nfsmw-2012-content is the one mod built with the workspace. The example mods (mods/hello and mods/lang-pack)
# are not members: mods/hello is its own workspace and is built on demand (`cargo build --manifest-path mods/hello/Cargo.toml`).
members = ["libs/*", "crates/*", "xtask", "mods/nfsmw-2012-content"]
# Every lib except the optional Bevy renderer, so a plain `cargo build` at the root never compiles bevy_render
# (`--workspace` and `-p blackbox-bevy-render` still reach it). Add new libs here.
default-members = [
    "libs/blackbox-trace",
    "libs/blackbox-aems",
    "libs/blackbox-anim",
    "libs/blackbox-attrib",
    "libs/blackbox-carparts",
    "libs/blackbox-damage",
    "libs/blackbox-carsound",
    "libs/blackbox-chunk",
    "libs/blackbox-collision",
    "libs/blackbox-feng",
    "libs/blackbox-gfx",
    "libs/blackbox-gfx-testkit",
    "libs/blackbox-ginsu",
    "libs/blackbox-gpu-passes",
    "libs/blackbox-hash",
    "libs/blackbox-i18n",
    "libs/blackbox-minimap",
    "libs/blackbox-mixmap",
    "libs/blackbox-modding",
    "libs/blackbox-net-core",
    "libs/blackbox-paramap",
    "libs/blackbox-fxedit",
    "libs/blackbox-playlist",
    "libs/blackbox-pursuit",
    "libs/blackbox-race",
    "libs/blackbox-speedfx",
    "libs/blackbox-movie",
    "libs/blackbox-nis",
    "libs/blackbox-render",
    "libs/blackbox-scene",
    "libs/blackbox-scenery",
    "libs/blackbox-smaa",
    "libs/blackbox-solid",
    "libs/blackbox-streaming",
    "libs/blackbox-text",
    "libs/blackbox-tpk",
    "libs/blackbox-ui",
    "libs/blackbox-vehicle",
    "libs/chameleon-bundle",
    "libs/chameleon-effects",
    "libs/chameleon-gfx",
    "libs/chameleon-sound-graph",
    "libs/chameleon-text",
    "libs/chameleon-vehicle",
    "libs/ini-tuning",
    "libs/ea-audio",
    "libs/ea-compress",
    "libs/game-install",
    "libs/save-store",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rayon = "=1.11.0"
blackbox-trace = { path = "libs/blackbox-trace" }
