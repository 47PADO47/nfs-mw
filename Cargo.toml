[workspace]
resolver = "3"
# libs/   engine-generic libraries (EA Black Box formats, codecs, install discovery, rendering).
#         No NFS:MW-specific code: they are meant to move to a shared utilities monorepo.
# crates/ the NFS:MW game itself.
members = ["libs/*", "crates/*", "xtask", "examples/mods/hello"]
# Every lib except the optional Bevy renderer, so a plain `cargo build` at the root never compiles bevy_render
# (`--workspace` and `-p blackbox-bevy-render` still reach it). Add new libs here.
default-members = [
    "libs/blackbox-aems",
    "libs/blackbox-attrib",
    "libs/blackbox-carparts",
    "libs/blackbox-damage",
    "libs/blackbox-carsound",
    "libs/blackbox-chunk",
    "libs/blackbox-collision",
    "libs/blackbox-feng",
    "libs/blackbox-gfx",
    "libs/blackbox-gfx-testkit",
    "libs/blackbox-ginsu",
    "libs/blackbox-gpu-passes",
    "libs/blackbox-hash",
    "libs/blackbox-minimap",
    "libs/blackbox-mixmap",
    "libs/blackbox-modding",
    "libs/blackbox-paramap",
    "libs/blackbox-fxedit",
    "libs/blackbox-playlist",
    "libs/blackbox-pursuit",
    "libs/blackbox-speedfx",
    "libs/blackbox-movie",
    "libs/blackbox-render",
    "libs/blackbox-scene",
    "libs/blackbox-scenery",
    "libs/blackbox-smaa",
    "libs/blackbox-solid",
    "libs/blackbox-streaming",
    "libs/blackbox-text",
    "libs/blackbox-tpk",
    "libs/blackbox-vehicle",
    "libs/ini-tuning",
    "libs/ea-audio",
    "libs/ea-compress",
    "libs/game-install",
    "libs/save-store",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Engine-generic libraries (libs/)
blackbox-aems = { path = "libs/blackbox-aems" }
blackbox-attrib = { path = "libs/blackbox-attrib" }
blackbox-carparts = { path = "libs/blackbox-carparts" }
blackbox-carp = { path = "libs/blackbox-carp" }
blackbox-carsound = { path = "libs/blackbox-carsound" }
blackbox-bevy-render = { path = "libs/blackbox-bevy-render" }
blackbox-chunk = { path = "libs/blackbox-chunk" }
blackbox-collision = { path = "libs/blackbox-collision" }
blackbox-damage = { path = "libs/blackbox-damage" }
blackbox-driver = { path = "libs/blackbox-driver" }
blackbox-feng = { path = "libs/blackbox-feng" }
blackbox-gfx = { path = "libs/blackbox-gfx" }
blackbox-gfx-testkit = { path = "libs/blackbox-gfx-testkit" }
blackbox-ginsu = { path = "libs/blackbox-ginsu" }
blackbox-gpu-passes = { path = "libs/blackbox-gpu-passes" }
blackbox-hash = { path = "libs/blackbox-hash" }
blackbox-minimap = { path = "libs/blackbox-minimap" }
blackbox-modding = { path = "libs/blackbox-modding" }
blackbox-playlist = { path = "libs/blackbox-playlist" }
blackbox-mixmap = { path = "libs/blackbox-mixmap" }
blackbox-paramap = { path = "libs/blackbox-paramap" }
blackbox-fxedit = { path = "libs/blackbox-fxedit" }
blackbox-pursuit = { path = "libs/blackbox-pursuit" }
blackbox-speedfx = { path = "libs/blackbox-speedfx" }
blackbox-movie = { path = "libs/blackbox-movie" }
blackbox-particles = { path = "libs/blackbox-particles" }
blackbox-render = { path = "libs/blackbox-render" }
blackbox-roads = { path = "libs/blackbox-roads" }
blackbox-scene = { path = "libs/blackbox-scene" }
blackbox-scenery = { path = "libs/blackbox-scenery" }
blackbox-sequence = { path = "libs/blackbox-sequence" }
blackbox-smaa = { path = "libs/blackbox-smaa" }
blackbox-solid = { path = "libs/blackbox-solid" }
blackbox-streaming = { path = "libs/blackbox-streaming" }
blackbox-text = { path = "libs/blackbox-text" }
blackbox-tpk = { path = "libs/blackbox-tpk" }
blackbox-vehicle = { path = "libs/blackbox-vehicle" }
ini-tuning = { path = "libs/ini-tuning" }
ea-audio = { path = "libs/ea-audio" }
ea-compress = { path = "libs/ea-compress" }
fsr3-wgpu = { path = "libs/fsr3-wgpu" }
game-install = { path = "libs/game-install" }
save-store = { path = "libs/save-store" }
# NFS:MW (crates/)
nfsmw-career = { path = "crates/nfsmw-career" }
nfsmw-data = { path = "crates/nfsmw-data" }
nfsmw-modding = { path = "crates/nfsmw-modding" }

# Third-party (see docs/rust-stack.md for why each was picked)
# Bevy: the ECS shell (docs/decisions/0001-bevy.md), plus the render crates only blackbox-bevy-render uses
# (docs/decisions/0004-swappable-renderers.md). Pinned to the exact 0.20 release.
bevy_a11y = "=0.20.0"
bevy_anti_alias = "=0.20.0"
bevy_app = "=0.20.0"
bevy_asset = "=0.20.0"
bevy_camera = "=0.20.0"
bevy_color = "=0.20.0"
bevy_core_pipeline = "=0.20.0"
bevy_diagnostic = "=0.20.0"
bevy_ecs = "=0.20.0"
bevy_image = "=0.20.0"
bevy_light = "=0.20.0"
bevy_log = "=0.20.0"
bevy_material = "=0.20.0"
bevy_math = "=0.20.0"
bevy_mesh = "=0.20.0"
bevy_pbr = "=0.20.0"
# Bloom (depth of field and other screen-space effects are not used): moved out of bevy_core_pipeline in 0.20.
bevy_post_process = "=0.20.0"
bevy_reflect = "=0.20.0"
bevy_render = "=0.20.0"
bevy_shader = "=0.20.0"
# Solari ray tracing (ADR 0004, `ray-tracing` feature of blackbox-bevy-render). Exists on crates.io for 0.20.0.
bevy_solari = "=0.20.0"
bevy_transform = "=0.20.0"
bevy_gilrs = "=0.20.0"
bevy_input = { version = "=0.20.0", features = ["serialize"] }
bevy_time = "=0.20.0"
bevy_window = { version = "=0.20.0", features = ["custom_cursor"] }
bevy_winit = { version = "=0.20.0", features = ["custom_cursor"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
discord-rich-presence = "=1.1.0"
egui = "0.36"
env_logger = "0.11"
foldhash = "0.2.0"
glam = { version = "0.34", features = ["bytemuck"] }
kira = { version = "0.12", default-features = false, features = ["cpal"] }
libloading = "0.8"
log = "0.4"
mimalloc = { version = "0.1", default-features = false }
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
png = "0.18"
pollster = "0.4"
raw-window-handle = "0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
texture2ddecoder = "0.1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "id3v2", "id3v1", "ape"] }
thiserror = "2"
toml = "0.9"
wgpu = "30"
winreg = "0.56"
# VP6 video: the VP5/VP6 subset of NihAV that Ruffle split out and kindly had relicensed to MIT by its
# author (COPYING in the repo). Pinned to a commit; not on crates.io. deny.toml lists the repo.
nihav_core = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }
nihav_duck = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Our own crates: the per-frame render bridge and scene systems are CPU work on every frame, so unoptimised code
# shows up as frame time in dev builds. Level 1 keeps compiles quick. To step through code in a debugger, set
# CARGO_PROFILE_DEV_OPT_LEVEL=0: optimised code skips breakpoints.
opt-level = 1

[profile.dev.package."*"]
# Decompression and texture decoding are painfully slow unoptimised.
opt-level = 2

[profile.profiling]
# Release codegen plus line tables, so Tracy, VTune, Superluminal and perf can name functions and source lines.
# Same optimisation as release: only debug info is added, so timings stay representative.
inherits = "release"
debug = "line-tables-only"

[profile.dist]
# Shipped builds: fat LTO and one codegen unit for the last few percent of runtime. Much slower to build than release,
# so use it for releases only, not for iteration.
inherits = "release"
lto = "fat"
codegen-units = 1
