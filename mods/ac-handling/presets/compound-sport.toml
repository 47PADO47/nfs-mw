# The sport compound preset (docs/specs/ac-handling/parameter-mapping.md section 5.2). Design values, not measurements.
schema = 1
kind = "compound"
name = "sport"
level_ref = 1.00
grip_slope = 0.55

[tyre]
mu_y0 = 1.20
mu_x_ratio = 1.10
exp_y = 0.85
exp_x = 0.88
peak_angle_deg = 8.0
flex = 0.20
cx_ratio = 1.4
fall_y = 0.85
fall_x = 0.82
q_y = 1.2
q_x = 1.4
speed_sens = 0.0012
relax_len = 0.34

# Which optional units start on for a car on this compound, and the starting levels of the aids (used when the aids unit is on and
# the player has not moved the slider). Design values.
[units]
suspension = true
thermal = true
aids = false
steering = false
tc = 1
abs = 1
esc = 0
