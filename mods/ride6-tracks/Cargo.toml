[package]
name = "ride6-tracks"
description = "Native mod: the tracks of the user's own RIDE 6 install, converted from the exporter's track packs into second worlds of NFS: Most Wanted (2005), in the background; also the importer command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ride6-track-import"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blackbox-attrib.workspace = true
blackbox-chunk.workspace = true
blackbox-collision.workspace = true
blackbox-hash.workspace = true
blackbox-modding = { workspace = true, features = ["sdk"] }
blackbox-solid.workspace = true
blackbox-tpk.workspace = true
clap.workspace = true
log.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
# The golden test of the manifests reads them back with the schemas of the game (libraries; nothing depends on the mod).
blackbox-modding = { workspace = true, features = ["host"] }
blackbox-streaming.workspace = true

[lints]
workspace = true
