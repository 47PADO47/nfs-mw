# Adds the cars of NFS Most Wanted (2012) (mods/nfsmw-2012-content/README.md). Put the folder of your 2012 install in
# config.toml (the mod writes a commented one the first time the game starts) and restart: the cars are converted in
# the background, once, and are in the garage and the career as soon as they are ready.

[mod]
id = "nfsmw-2012-content"
name = "NFS Most Wanted (2012) content"
version = "0.1.0"
authors = ["nfs-mw contributors"]
license = "MIT OR Apache-2.0"

[api]
blackbox_modding = "0.1"

[games]
supported = ["nfsmw"]

[optional.interfaces]
"bb.camera" = "1.1"
"bb.content" = "1.0"
"bb.engine" = "1.0"
"bb.hud" = "1.0"
"bb.settings" = "1.0"
"bb.vehicles" = "1.2"

# The 2012 soundtrack: the mod writes music/MW2012.m3u8, a playlist of the songs in the 2012 install (soundtrack.rs); the game
# decodes them from there. They join the custom music, so they play when the game's Custom music option is on.
[music]
contexts = ["menu", "free_roam"]

[library]
windows = "nfsmw_2012_content.dll"
linux = "libnfsmw_2012_content.so"
macos = "libnfsmw_2012_content.dylib"
