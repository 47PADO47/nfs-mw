# cargo-deny: license and source policy for dependencies.
# The project is MIT OR Apache-2.0; see docs/licensing.md for what may be linked.

[graph]
all-features = false

[licenses]
# Permissive licenses only. MPL-2.0 is file-level copyleft and is fine as long as
# we don't modify MPL files. GPL/LGPL/AGPL are deliberately absent.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

# egui's bundled UI fonts (Hack, Ubuntu-Light, Noto Emoji, emoji-icon-font). Embedding is allowed by
# the SIL OFL 1.1 and the Ubuntu Font Licence as long as their notices ship with the binary; see NOTICE.
exceptions = [
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

# The VP6 decoder of NihAV that ruffle-rs split out (https://github.com/ruffle-rs/nihav-vp6): its author
# relicensed this subset under MIT for Ruffle (COPYING at the repo root, one directory above each crate),
# but the manifests have no `license` field, so the license is stated here. Pinned in Cargo.toml.
# The hash is the CRC-32 of COPYING at that commit.
[[licenses.clarify]]
crate = "nihav_core"
expression = "MIT"
license-files = [{ path = "../COPYING", hash = 0x1973988d }]

[[licenses.clarify]]
crate = "nihav_codec_support"
expression = "MIT"
license-files = [{ path = "../COPYING", hash = 0x1973988d }]

[[licenses.clarify]]
crate = "nihav_duck"
expression = "MIT"
license-files = [{ path = "../COPYING", hash = 0x1973988d }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The VP6 decoder (see the clarifications above); not on crates.io.
allow-git = ["https://github.com/ruffle-rs/nihav-vp6"]
