[package]
name = "nfsmw"
description = "NFS: Most Wanted rewrite: the launcher and viewers. Reads data from the user's own install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bevy_a11y.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_gilrs.workspace = true
bevy_input.workspace = true
bevy_time.workspace = true
bevy_window.workspace = true
bevy_winit.workspace = true
blackbox-aems.workspace = true
blackbox-bevy-render = { workspace = true, optional = true }
blackbox-attrib.workspace = true
blackbox-carsound.workspace = true
blackbox-chunk.workspace = true
blackbox-collision.workspace = true
blackbox-feng.workspace = true
blackbox-gfx.workspace = true
blackbox-minimap.workspace = true
blackbox-mixmap.workspace = true
blackbox-movie.workspace = true
blackbox-particles.workspace = true
blackbox-ginsu.workspace = true
blackbox-render.workspace = true
blackbox-scene.workspace = true
blackbox-scenery.workspace = true
blackbox-streaming.workspace = true
blackbox-text.workspace = true
blackbox-tpk.workspace = true
blackbox-vehicle.workspace = true
clap.workspace = true
ea-audio.workspace = true
egui.workspace = true
env_logger.workspace = true
game-install.workspace = true
glam.workspace = true
kira.workspace = true
log.workspace = true
nfsmw-data.workspace = true
png.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# The optional Bevy renderer (docs/renderers.md, docs/bevy-backend.md). The default build never has it, so it
# never compiles bevy_render.
renderer-bevy = ["dep:blackbox-bevy-render"]
# Tracy profiling of the Bevy renderer (docs/bevy-backend.md). Implies renderer-bevy.
trace = ["renderer-bevy", "blackbox-bevy-render/trace"]

[lints]
workspace = true
