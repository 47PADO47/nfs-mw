[package]
name = "nfsmw"
description = "NFS: Most Wanted rewrite: the launcher and viewers. Reads data from the user's own install."
version.workspace = true
edition.workspace = true
# The default features build the Bevy renderer, whose shader stack needs 1.97.1; `--no-default-features` builds on 1.95.
rust-version = "1.97.1"
license.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
serde_json = "1"
blackbox-trace.workspace = true
blackbox-hash.workspace = true
anyhow.workspace = true
bevy_a11y.workspace = true
bevy_app.workspace = true
bevy_asset.workspace = true
bevy_ecs.workspace = true
bevy_gilrs.workspace = true
bevy_image.workspace = true
bevy_input.workspace = true
bevy_log.workspace = true
bevy_time.workspace = true
bevy_window.workspace = true
bevy_winit.workspace = true
blackbox-aems.workspace = true
blackbox-bevy-render = { workspace = true, optional = true }
blackbox-anim.workspace = true
blackbox-attrib.workspace = true
blackbox-carsound.workspace = true
blackbox-chunk.workspace = true
blackbox-collision.workspace = true
blackbox-damage.workspace = true
blackbox-driver.workspace = true
blackbox-net-core.workspace = true
blackbox-pursuit.workspace = true
blackbox-race.workspace = true
blackbox-speedfx.workspace = true
blackbox-feng.workspace = true
blackbox-gfx.workspace = true
ini-tuning.workspace = true
blackbox-minimap.workspace = true
blackbox-nis.workspace = true
blackbox-playlist.workspace = true
blackbox-mixmap.workspace = true
blackbox-modding = { workspace = true, features = ["host"] }
blackbox-paramap.workspace = true
blackbox-fxedit.workspace = true
blackbox-movie.workspace = true
blackbox-particles.workspace = true
blackbox-ginsu.workspace = true
blackbox-render.workspace = true
blackbox-roads.workspace = true
blackbox-scene.workspace = true
blackbox-solid.workspace = true
blackbox-scenery.workspace = true
blackbox-sequence.workspace = true
blackbox-streaming.workspace = true
blackbox-text.workspace = true
blackbox-tpk.workspace = true
blackbox-ui.workspace = true
blackbox-vehicle.workspace = true
clap.workspace = true
ea-audio.workspace = true
discord-rich-presence.workspace = true
egui.workspace = true
env_logger.workspace = true
foldhash.workspace = true
game-install.workspace = true
save-store.workspace = true
glam.workspace = true
kira.workspace = true
# Bevy setup guide: compile out trace/debug logs in debug and info/debug logs in release (Bevy's dependencies log heavily).
log = { workspace = true, features = ["max_level_debug", "release_max_level_warn"] }
mimalloc = { workspace = true, optional = true }
nfsmw-career.workspace = true
nfsmw-data.workspace = true
nfsmw-modding = { workspace = true, features = ["host"] }
nfsmw-net.workspace = true
nfsmw-sim.workspace = true
png.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
symphonia.workspace = true
toml.workspace = true
wgpu.workspace = true
ab_glyph = "0.2.32"
arboard = { version = "3.7", default-features = false }
open = "5.4"
epaint_default_fonts = "0.36.2"

[features]
native-dlss = ["blackbox-render/streamline"]
# mimalloc as the global allocator (src/main.rs): 3-5 % less CPU per frame than the system allocator in the world frame cost
# benchmark (docs/profiling.md). Needs a C compiler; `--no-default-features` leaves it out.
mimalloc = ["dep:mimalloc"]
# The Bevy renderer and the FSR 3 upscaler are in the default build. `--no-default-features` leaves them out: the game
# is then the native renderer alone (FSR 1 is its best upscaler) and never compiles bevy_render.
default = ["renderer-bevy", "fsr3", "mimalloc"]
# The Bevy renderer (docs/renderers.md, docs/bevy-backend.md).
renderer-bevy = ["dep:blackbox-bevy-render"]
# Tracy profiling of the Bevy renderer (docs/bevy-backend.md). Implies renderer-bevy.
trace = ["renderer-bevy", "blackbox-bevy-render/trace"]
# DLSS Super Resolution (needs the NVIDIA DLSS SDK at build time; docs/setup.md). Implies renderer-bevy.
dlss = ["renderer-bevy", "blackbox-bevy-render/dlss"]
# DLSS code path with no SDK, for CI and tests. Implies renderer-bevy.
dlss-mock = ["renderer-bevy", "blackbox-bevy-render/dlss-mock"]
# Solari ray tracing (Vulkan, RTX-class GPU). Implies renderer-bevy.
ray-tracing = ["renderer-bevy", "blackbox-bevy-render/ray-tracing"]
# FSR 3.1 temporal upscaler on the Bevy renderer. Implies renderer-bevy.
fsr3 = ["renderer-bevy", "blackbox-bevy-render/fsr3"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
