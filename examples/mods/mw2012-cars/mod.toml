# Adds the cars of NFS Most Wanted (2012) (docs/modding/mw2012-cars.md). Put the folder of your 2012 install in
# config.toml (the mod writes a commented one the first time the game starts) and restart: the cars are converted while
# the game starts, once, and listed with the game's own.

[mod]
id = "mw2012.cars"
name = "NFS Most Wanted (2012) cars"
version = "0.1.0"
authors = ["nfs-mw contributors"]
license = "MIT OR Apache-2.0"

[api]
blackbox_modding = "0.1"

[games]
supported = ["nfsmw"]

[library]
windows = "mw2012_cars_mod.dll"
linux = "libmw2012_cars_mod.so"
macos = "libmw2012_cars_mod.dylib"
